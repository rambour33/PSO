<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>PSO – Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="overlay.css" />
  <link rel="stylesheet" href="/pso-transition.css" />
</head>
<body>
  <div id="scoreboard" class="scoreboard pso-surface">

    <!-- Logo défilant (thèmes custom) -->
    <div class="theme-logo-bg" id="theme-logo-bg"></div>

    <!-- Particules canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Barre événement (partagée) -->
    <div class="event-bar">
      <span id="event-name">TOURNAMENT</span>
      <span class="sep">·</span>
      <span id="event-stage">Grand Final</span>
      <span class="sep">·</span>
      <span id="format-info">Bo3</span>
      <span class="sep" id="current-stage-sep" style="display:none">·</span>
      <span id="current-stage-name"></span>
    </div>

    <!-- Layout complet -->
    <div class="full-layout">
      <div class="players-container">
        <div class="player player-left" id="player1-block">
          <div class="player-character" id="p1-character">
            <div class="char-placeholder" id="p1-char-placeholder">?</div>
            <img id="p1-char-img" alt="" style="display:none" />
          </div>
          <div class="player-info">
            <div class="player-name" id="p1-name">PLAYER 1</div>
          </div>
          <img id="p1-flag-img"  class="player-flag player-flag-left"  src="" alt="" style="display:none" />
          <img id="p1-flag2-img" class="player-flag2 player-flag2-left" src="" alt="" style="display:none" />
        </div>
        <div class="score-center">
          <div class="score-box">
            <div class="dots-col-left" id="p1-dots-col"></div>
            <span class="score" id="p1-score">0</span>
            <div class="center-logo-area">
              <span class="score-vs" id="score-vs">VS</span>
              <img id="center-logo-img" src="" alt="" style="display:none" />
            </div>
            <span class="score" id="p2-score">0</span>
            <div class="dots-col-right" id="p2-dots-col"></div>
          </div>
          <div class="series-dots">
            <div class="dots-left" id="p1-dots"></div>
            <div class="dots-right" id="p2-dots"></div>
          </div>
        </div>
        <div class="player player-right" id="player2-block">
          <div class="player-info">
            <div class="player-name" id="p2-name">PLAYER 2</div>
          </div>
          <div class="player-character" id="p2-character">
            <div class="char-placeholder" id="p2-char-placeholder">?</div>
            <img id="p2-char-img" alt="" style="display:none" />
          </div>
          <img id="p2-flag-img"  class="player-flag player-flag-right"  src="" alt="" style="display:none" />
          <img id="p2-flag2-img" class="player-flag2 player-flag2-right" src="" alt="" style="display:none" />
        </div>
      </div>
    </div>

    <!-- Layout slim -->
    <div class="slim-layout">
      <div class="slim-bar">
        <div class="slim-player slim-left" id="player1-block-slim">
          <img class="slim-stock-icon" id="p1-stock-icon" src="" alt="" style="display:none" />
          <div class="slim-icon-sep" id="p1-icon-sep" style="display:none"></div>
          <span class="slim-name" id="p1-name-slim">PLAYER 1</span>
        </div>
        <div class="slim-scores">
          <span class="slim-score" id="p1-score-slim">0</span>
          <div class="slim-center-logo">
            <span class="slim-vs" id="slim-vs">VS</span>
            <img id="center-logo-img-slim" src="" alt="" style="display:none" />
          </div>
          <span class="slim-score" id="p2-score-slim">0</span>
        </div>
        <div class="slim-player slim-right" id="player2-block-slim">
          <span class="slim-name" id="p2-name-slim">PLAYER 2</span>
          <div class="slim-icon-sep" id="p2-icon-sep" style="display:none"></div>
          <img class="slim-stock-icon" id="p2-stock-icon" src="" alt="" style="display:none" />
        </div>
      </div>
    </div>

    <!-- Layout Pro (style tournoi) -->
    <div class="pro-layout">

      <!-- Round info (absolu, haut gauche) -->
      <div class="pro-round">
        <div class="pro-round-type" id="pro-round-type">TOURNOI</div>
        <div class="pro-round-name" id="pro-round-name">GRAND FINAL</div>
      </div>

      <!-- Scoreboard (centré) -->
      <div class="pro-sb">

        <!-- Joueur 1 -->
        <div class="pro-side pro-p1-side" id="pro-p1-block">
          <div class="pro-char-sm">
            <div class="pro-char-ph" id="pro-p1-char-ph">?</div>
            <img id="pro-p1-char-img" src="" alt="" style="display:none" />
          </div>
          <div class="pro-names">
            <span class="pro-ptag" id="pro-p1-tag-el"></span>
            <span class="pro-pname" id="pro-p1-name-el">PLAYER 1</span>
          </div>
          <div class="pro-score-circ pro-p1-circ">
            <span id="pro-p1-score-el">0</span>
          </div>
        </div>

        <!-- Centre logo -->
        <div class="pro-sb-center">
          <div class="pro-logo-wrap">
            <img id="pro-logo-img" src="" alt="" style="display:none" />
            <span id="pro-logo-vs">VS</span>
          </div>
        </div>

        <!-- Joueur 2 -->
        <div class="pro-side pro-p2-side" id="pro-p2-block">
          <div class="pro-char-sm">
            <div class="pro-char-ph" id="pro-p2-char-ph">?</div>
            <img id="pro-p2-char-img" src="" alt="" style="display:none" />
          </div>
          <div class="pro-names pro-names-r">
            <span class="pro-ptag" id="pro-p2-tag-el"></span>
            <span class="pro-pname" id="pro-p2-name-el">PLAYER 2</span>
          </div>
          <div class="pro-score-circ pro-p2-circ">
            <span id="pro-p2-score-el">0</span>
          </div>
        </div>

      </div><!-- /pro-sb -->

      <!-- Bande info (centrée, même largeur que pro-sb) -->
      <div class="pro-infobar">
        <div class="pro-chips pro-chips-l" id="pro-chips-p1"></div>
        <div class="pro-chips-gap"></div>
        <div class="pro-chips pro-chips-r" id="pro-chips-p2"></div>
      </div>

    </div><!-- /pro-layout -->

  </div>

  <!-- Lower-third : overlay indépendant (hors scoreboard) -->
  <div id="lt-layout" class="lt-layout">

    <!-- Panneau Joueur 1 (gauche) -->
    <div class="lt-panel lt-panel-left" id="lt-p1">
      <div class="lt-pronouns-badge" id="lt-p1-pronouns"></div>
      <div class="lt-inner">
        <div class="lt-flag-box" id="lt-p1-flag-box">
          <img class="lt-flag-img" id="lt-p1-flag-img" src="" alt="" style="display:none" />
          <span class="lt-flag-code" id="lt-p1-flag-code"></span>
        </div>
        <div class="lt-info">
          <span class="lt-tag" id="lt-p1-tag"></span>
          <span class="lt-name" id="lt-p1-name">PLAYER 1</span>
        </div>
        <div class="lt-score" id="lt-p1-score">0</div>
      </div>
      <div class="lt-social-bar" id="lt-p1-social-bar">
        <span class="lt-social-text" id="lt-p1-social-text"></span>
      </div>
    </div>

    <!-- Panneau Joueur 2 (droite) -->
    <div class="lt-panel lt-panel-right" id="lt-p2">
      <div class="lt-pronouns-badge lt-pronouns-right" id="lt-p2-pronouns"></div>
      <div class="lt-inner">
        <div class="lt-flag-box" id="lt-p2-flag-box">
          <img class="lt-flag-img" id="lt-p2-flag-img" src="" alt="" style="display:none" />
          <span class="lt-flag-code" id="lt-p2-flag-code"></span>
        </div>
        <div class="lt-info">
          <span class="lt-tag" id="lt-p2-tag"></span>
          <span class="lt-name" id="lt-p2-name">PLAYER 2</span>
        </div>
        <div class="lt-score" id="lt-p2-score">0</div>
      </div>
      <div class="lt-social-bar" id="lt-p2-social-bar">
        <span class="lt-social-text" id="lt-p2-social-text"></span>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/texture.js"></script>
  <script src="particle-engine.js"></script>
  <script src="overlay.js"></script>
  <script>window.PSO_T = { id: 'scoreboard', root: '#scoreboard' };</script>
  <script src="/pso-transition.js"></script>
</body>
</html>
